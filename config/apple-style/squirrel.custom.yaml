# encoding: utf-8
# native 会用不透明 windowBackgroundColor 盖住玻璃，磨砂等于没开。
# 色值是 0xAABBGGRR。
patch:
  status_icon/show: false
  # 官方默认 VS Code 进西文；中文模式必须同时关掉 ascii_punct，否则逗号句号仍是英文
  app_options/com.microsoft.VSCode:
    ascii_mode: false
    ascii_punct: false
  app_options/com.microsoft.VSCode.helper:
    ascii_mode: false
    ascii_punct: false
  style/color_scheme: apple_style
  style/color_scheme_dark: apple_style_dark
  preset_color_schemes/apple_style:
    name: Apple Style
    author: chehongweo
    candidate_list_layout: linear
    text_orientation: horizontal
    inline_preedit: true
    inline_candidate: false
    show_paging: false
    translucency: true
    font_face: "PingFangSC-Regular"
    font_point: 14
    label_font_face: ".AppleSystemUIFont"
    label_font_point: 11
    comment_font_face: "PingFangSC-Regular"
    comment_font_point: 12
    back_color: 0x22FFFFFF
    border_color: 0x00000000
    candidate_text_color: 0x1D1D1F
    hilited_candidate_text_color: 0xFFFFFF
    hilited_candidate_back_color: 0xCCFF7A00
    label_color: 0x1D1D1F
    hilited_candidate_label_color: 0xFFFFFF
    comment_text_color: 0x86868B
    hilited_comment_text_color: 0xF2F2F7
    text_color: 0x3A3A3C
    hilited_text_color: 0x1D1D1F
  preset_color_schemes/apple_style_dark:
    name: Apple Style Dark
    author: chehongweo
    candidate_list_layout: linear
    text_orientation: horizontal
    inline_preedit: true
    inline_candidate: false
    show_paging: false
    translucency: true
    font_face: "PingFangSC-Regular"
    font_point: 14
    label_font_face: ".AppleSystemUIFont"
    label_font_point: 11
    comment_font_face: "PingFangSC-Regular"
    comment_font_point: 12
    back_color: 0x221C1C1E
    border_color: 0x00000000
    candidate_text_color: 0xF5F5F7
    hilited_candidate_text_color: 0xFFFFFF
    hilited_candidate_back_color: 0xCCFF7A00
    label_color: 0xF5F5F7
    hilited_candidate_label_color: 0xFFFFFF
    comment_text_color: 0x8E8E93
    hilited_comment_text_color: 0xEBEBF0
    text_color: 0x8E8E93
    hilited_text_color: 0xF5F5F7
